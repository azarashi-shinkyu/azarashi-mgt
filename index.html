<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あざらしMGT</title>
<style>
:root{
  --blue:#5a8bd8; --blue-d:#2f5a9e; --blue-l:#edf3fc; --blue-m:#cfe0f7;
  --ink:#1d2433; --sub:#667089; --line:#e3e7ef; --bg:#f5f7fb; --card:#fff;
  --ok:#1f8a5b; --ok-l:#e3f4ec; --warn:#b4541a; --warn-l:#fbeee4; --sun:#c0392b; --sat:#2a64c4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.hdr{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.hdr .logo{width:46px;height:35px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.hdr .logo img{width:44px;height:auto;display:block}
.hdr h1{font-size:19px;margin:0;letter-spacing:.04em;font-weight:700;white-space:nowrap}
.hdr .me{margin-left:auto;text-align:right;font-size:12px;line-height:1.35}
.hdr .me b{font-size:14px;display:block}
.hdr .logout{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:#fff;margin-left:2px;padding:4px 8px;font-size:11px;white-space:nowrap}
.role-pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:1px 8px;margin-top:2px}
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:55px;z-index:19;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px 10px;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:980px;margin:0 auto;padding:16px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--blue-d);display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--blue);color:#fff;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:disabled{background:#b9cdec;border-color:#b9cdec;cursor:default}
.chip.add{border-style:dashed;border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:var(--line);color:var(--sub)}
.btn.danger{border-color:#e6b9b3;color:#b03a2e}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:0}
.inp:focus{outline:2px solid var(--blue-m);border-color:var(--blue)}
.datebar{display:flex;align-items:center;gap:10px}
.datebar .d{font-size:22px;font-weight:700;color:var(--blue-d)}
.datebar .w{font-size:15px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.vlist{flex-direction:column;flex-wrap:nowrap}
.reccard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.reccard .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.reccard .rh b{font-size:16px}
textarea.prev{color:#a3abbb}
.ptrow{display:flex;gap:6px;align-items:center}.ptrow .chip{flex:1}
.cheer{position:fixed;inset:0;background:rgba(20,40,80,.28);display:flex;align-items:center;justify-content:center;z-index:9999;animation:cFade .25s ease}
.cheer-box{background:#fff;border-radius:22px;padding:26px 24px;text-align:center;max-width:82vw;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:cPop .55s cubic-bezier(.2,1.6,.4,1)}
.cheer-emoji{font-size:44px;animation:cBounce 1s ease-in-out infinite}
.cheer-msg{font-size:18px;font-weight:700;color:#3a6fc4;margin-top:10px;line-height:1.6}
@keyframes cPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes cFade{from{opacity:0}to{opacity:1}}
.chips.vlist .chip{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between}
.chips.vlist .chip.add{justify-content:center}
.faclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.faclist li{border:1.5px solid var(--blue-m);border-radius:12px;padding:10px 12px;background:#fff}
.faclist li.on{border-color:var(--blue);background:var(--blue-l);box-shadow:0 0 0 2px var(--blue-m)}
.faclist .fhead{display:flex;align-items:center;gap:8px}
.faclist .fname{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.faclist .fname b{font-size:16px;color:var(--ink)}
.faclist .cnt{background:var(--blue);color:#fff;border-radius:99px;font-size:12px;padding:2px 9px;font-weight:700}
.faclist .finfo{padding:4px 12px;font-size:12.5px}
.faclist .fsub{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;margin-top:4px;width:100%;box-sizing:border-box}
.faclist .muted{font-size:12.5px;overflow-wrap:anywhere}
.faclist .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.faclist .facts a.btn{text-decoration:none;display:inline-flex;align-items:center}
.faclist .facnum{font-size:11.5px;margin-top:6px;overflow-wrap:anywhere}
.chip{border:1.5px solid var(--blue-m);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;position:relative;min-height:44px}
.chip .cnt{display:inline-block;margin-left:6px;background:var(--blue);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on .cnt{background:#fff;color:var(--blue)}
.chip.fac.cur{outline:3px solid var(--blue-m)}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--sub);text-align:center;font-size:14px}
.sumlist{margin:0;padding:0;list-style:none}
.sumlist li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sumlist li:last-child{border-bottom:0}
.sumlist .f{color:var(--blue-d);font-weight:700;min-width:7em}
.sendbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center}
.sendbar .in{max-width:980px;width:100%;display:flex;align-items:center;gap:12px}
.sendbar .btn{flex:1;max-width:340px;margin-left:auto;padding:13px;font-size:16px}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.info{background:var(--blue-l);color:var(--blue)}
/* matrix */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:70vh}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:0;height:30px;min-width:28px}
.mx thead th{position:sticky;top:0;background:#f3f7fd;z-index:2;font-weight:600;line-height:1.1;padding:4px 0}
.mx thead th small{display:block;font-weight:400;color:var(--sub);font-size:10px}
.mx thead th.sun,.mx td.sun{background:#fdf1f0}.mx thead th.sun{color:var(--sun)}
.mx thead th.sat,.mx td.sat{background:#eef3fc}.mx thead th.sat{color:var(--sat)}
.mx .nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 10px;min-width:120px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mx thead .nm{z-index:3;background:#f3f7fd}
.mx tr.grp td{background:var(--blue-l);color:var(--blue-d);font-weight:700;text-align:left;padding:0;height:26px}
.mx tr.grp td span{position:sticky;left:0;display:inline-block;padding:0 10px;background:var(--blue-l);white-space:nowrap}
.mx td.hit{color:var(--blue);font-weight:800;font-size:14px}
.mx td.hit.multi{font-size:12px}
.mx .tot{background:#f7f9fc;font-weight:700;min-width:40px}
.mx tfoot td{background:#f0f3f9;font-weight:700;position:sticky;bottom:0}
.mx tfoot .nm{background:#f0f3f9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:clamp(17px,5vw,24px);white-space:nowrap;font-weight:800;color:var(--blue-d)}
.stat .v small{font-size:13px;font-weight:600;margin-left:2px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--blue-l);margin-bottom:12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:50;font-size:14px;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--warn-l);color:var(--warn);padding:9px 14px;font-size:13px;text-align:center}
.center{min-height:60vh;display:grid;place-items:center;text-align:center}
.onb{max-width:420px;width:100%}
.onb img{width:120px;margin:0 auto 6px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:12px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--blue);color:#fff}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px;text-align:left}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,50,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.legend{font-size:12px;color:var(--sub);margin-top:8px}
table.rc,table.pl{border-collapse:collapse;width:100%;font-size:13px}
table.rc th,table.rc td,table.pl th,table.pl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:right;white-space:nowrap}
table.rc th,table.pl th{background:#f3f7fd;color:var(--blue-d);font-weight:700;font-size:12px;text-align:center}
table.rc td:nth-child(2){text-align:center}
table.pl td.lb,table.pl th.lb{text-align:left;position:sticky;left:0;background:#fff;min-width:130px}
table.pl th.lb{background:#f3f7fd}
table.pl td.sum,table.pl th.sum{background:#f7f9fc;font-weight:700}
table.pl tr.sec td{background:var(--blue-l);color:var(--blue-d);font-weight:700;text-align:left;font-size:12px}
table.pl tr.strong td{font-weight:800}
table.pl tr.profit td{color:var(--blue-d);font-size:14px}
.plin{width:100px;text-align:right;padding:5px 8px}
.inp.fee{width:110px;text-align:right}
.inp.w{width:100%}
label.ck{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
label.ck input{width:18px;height:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fh{margin:18px 0 0;font-size:13px;color:var(--blue-d);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
@media (max-width:560px){.hdr h1{font-size:17px}.datebar .d{font-size:19px}}
</style>
</head>

/* ---------- local fallback store (for preview without sharing) ---------- */
function makeLocalDB(){
  const docs = new Map(); const subs = new Set();
  const snapDoc = (path) => { const v = docs.get(path); return { id: path.split("/").pop(), exists: !!v, data: () => v ? JSON.parse(JSON.stringify(v)) : undefined, metadata:{fromCache:false,hasPendingWrites:false} }; };
  const notify = () => subs.forEach(f => f());
  function query(cpath, filters){
    const run = () => { const out=[]; for(const [p] of docs){ const segs=p.split("/"); if(segs.slice(0,-1).join("/")!==cpath) continue; const s=snapDoc(p); const d=s.data(); if(filters.every(([f,op,v]) => op==="=="? d[f]===v : true)) out.push(s);} out.sort((a,b)=>a.id<b.id?-1:1); return {docs:out,size:out.length,empty:!out.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}; };
    return {
      where:(f,op,v)=>query(cpath,[...filters,[f,op,v]]),
      orderBy(){return this}, limit(){return this},
      get: async()=>run(),
      onSnapshot(next){ const f=()=>next(run()); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); }
    };
  }
  function docRef(path){ return {
    id:path.split("/").pop(), path,
    get: async()=>snapDoc(path),
    set: async(d)=>{ docs.set(path, JSON.parse(JSON.stringify(d))); notify(); },
    update: async(d)=>{ docs.set(path, {...(docs.get(path)||{}), ...JSON.parse(JSON.stringify(d))}); notify(); },
    delete: async()=>{ docs.delete(path); notify(); },
    onSnapshot(next){ const f=()=>next(snapDoc(path)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); }
  };}
  return {
    doc: docRef,
    collection: (cpath) => Object.assign(query(cpath,[]), { path:cpath, doc:(id)=>docRef(cpath+"/"+(id||rid())), add: async(d)=>{ const r=docRef(cpath+"/"+rid()); await r.set(d); return r; } })
  };
}

async function safeWrite(fn, okMsg){
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    console.error(e);
    if(e?.code==="invalid_argument"){ S.readOnly=true; toast("保存できませんでした。この操作をする権限がありません。"); }
    else if(e?.code==="quota_exceeded"){ toast("保存容量の上限に達しました。"); }
    else if(e?.code==="unavailable"){ toast("通信が不安定です。少し待ってからもう一度お試しください。"); }
    else toast("保存できませんでした（"+(e?.code||"エラー")+"）");
    render(); return false;
  }
}

function mapErr(e){ const c=e?.code||""; return {code: c==="permission-denied"?"invalid_argument" : c==="unavailable"||c==="deadline-exceeded"?"unavailable" : c==="resource-exhausted"?"quota_exceeded" : c||"error", message:e?.message||String(e)}; }
function wrapFirestore(fs, m){
  const snapDoc = s => ({id:s.id, exists:s.exists(), data:()=>s.data(), metadata:s.metadata});
  const snapQ = q => ({docs:q.docs.map(snapDoc), size:q.size, empty:q.empty, metadata:q.metadata, docChanges:()=>[]});
  const wrapP = p => p.catch(e=>{ throw mapErr(e); });
  function docRef(path){ const r=m.doc(fs,path); return {
    id:r.id, path,
    get: ()=>wrapP(m.getDoc(r).then(snapDoc)),
    set: d=>wrapP(m.setDoc(r,d)), update: d=>wrapP(m.updateDoc(r,d)), delete: ()=>wrapP(m.deleteDoc(r)),
    onSnapshot:(n,e)=>m.onSnapshot(r, s=>n(snapDoc(s)), err=>{ console.error(err); e&&e(mapErr(err)); })
  };}
  function query(path, cons){ const base=m.collection(fs,path); const build=()=>cons.length?m.query(base,...cons):base; return {
    where:(f,op,v)=>query(path,[...cons,m.where(f,op,v)]),
    orderBy:(f,d)=>query(path,[...cons,m.orderBy(f,d)]),
    limit:n=>query(path,[...cons,m.limit(n)]),
    get: ()=>wrapP(m.getDocs(build()).then(snapQ)),
    onSnapshot:(n,e)=>m.onSnapshot(build(), s=>n(snapQ(s)), err=>{ console.error(err); e&&e(mapErr(err)); })
  };}
  return { doc:docRef, collection:p=>Object.assign(query(p,[]),{path:p, doc:id=>docRef(p+"/"+(id||rid())), add:async d=>{ const r=docRef(p+"/"+rid()); await r.set(d); return r; }}) };
}

(async function boot(){
  if(DEMO){ S.db=makeLocalDB(); S.local=true; S.uid="local-user"; S.authUser={email:OWNER_EMAIL}; S.authReady=true;
    if(window.__SEED__){ const sd=window.__SEED__.data||{};
      await S.db.doc("config/roles").set({owner:S.uid, admins:[]});
      await S.db.collection("members").doc(S.uid).set(window.__STAFF__ ? {name:"テスト施術者", email:"staff@example.com", storeId:"kuise", active:true, createdAt:new Date().toISOString()} : {name:"石井（デモ）", email:OWNER_EMAIL, active:true, createdAt:new Date().toISOString()});
      for(const [c,docs] of Object.entries(sd)) for(const [id,d] of Object.entries(docs)) await S.db.collection(c).doc(id).set(d); }
    await afterLogin(); return; }
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, authM, fsM] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    Object.assign(FB,{appM,authM,fsM});
    FB.app = appM.initializeApp(FIREBASE_CONFIG);
    FB.auth = authM.getAuth(FB.app);
    FB.fs = fsM.initializeFirestore(FB.app, {ignoreUndefinedProperties:true});
    S.db = wrapFirestore(FB.fs, fsM);
    authM.onAuthStateChanged(FB.auth, async u=>{
      S.authReady=true;
      if(!u){ resetSession(); S.authUser=null; render(); return; }
      S.authUser=u; S.uid=u.uid; await afterLogin();
    });
  }catch(e){ console.error(e); S.loadError="fb"; render(); }
})();
function resetSession(){
  (S._unsubs||[]).forEach(f=>{ try{f()}catch(e){} }); S._unsubs=[];
  S.monthUnsub?.(); S.confUnsub?.(); S.rcUnsub?.(); S.plUnsub?.();
  Object.assign(S,{uid:null, me:null, members:{}, facilities:{}, patients:{}, stores:{}, sales:{}, isOwner:false, admins:[], roles:null, _subMonth:null, _salesSub:false, _adminSubs:false, notMember:false, needOwnerSetup:false, tab:null,
    loaded:{members:false,facilities:false,patients:false}});
}
const track = u => { (S._unsubs=S._unsubs||[]).push(u); return u; };
async function afterLogin(){
  // 1) roles
  let roles=null;
  try{ const r=await S.db.doc("config/roles").get(); roles = r.exists ? r.data() : null; }
  catch(e){ console.error(e); S.loadError=e?.code||"error"; render(); return; }
  const email=(S.authUser?.email||"").toLowerCase();
  if(!roles && email===OWNER_EMAIL){ S.needOwnerSetup=true; render(); return; }
  S.roles=roles||{}; S.isOwner = S.local ? !window.__STAFF__ : (roles?.owner===S.uid); S.admins=roles?.admins||[];
  // 2) membership
  let me=null;
  try{ const m=await S.db.collection("members").doc(S.uid).get(); me = m.exists ? m.data() : null; }
  catch(e){ console.error(e); S.loadError=e?.code||"error"; render(); return; }
  if(!me && (S.local || roles?.owner===S.uid)){ S.needOwnerSetup=true; render(); return; }
  if(!me || me.active===false){ S.notMember=true; render(); return; }
  startData();
}
function startData(){
  const timer = setTimeout(()=>{ if(!allLoaded()){ S.loadTimeout=true; render(); } }, 12000);
  const done = k => { S.loaded[k]=true; if(allLoaded()) clearTimeout(timer); };
  const onErr = e => { console.error(e); S.loadError=e?.code||"error"; clearTimeout(timer); render(); };
  track(S.db.doc("config/roles").onSnapshot(snap=>{ const r=snap.exists?snap.data():{}; const was=isAdmin(); S.roles=r; S.isOwner = S.local?!window.__STAFF__:(r.owner===S.uid); S.admins=r.admins||[]; if(was!==isAdmin()){ S._subMonth=null; S.tab=null; } render(); }, e=>console.error(e)));
  track(S.db.collection("members").onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.members=m; S.me=m[S.uid]||null; done("members");
    if(S.me && S.me.active===false){ S.notMember=true; }
    render();
  }, onErr));
  track(S.db.collection("facilities").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.facilities=m; done("facilities"); render(); }, onErr));
  track(S.db.collection("patients").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.patients=m; done("patients"); render(); }, onErr));
  // 同意書に印字する医療機関・医師名を施術者も読めるように
  track(S.db.collection("stores").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.stores=m; render(); }, onErr));
  track(S.db.collection("clinics").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.clinics=m; render(); }, onErr));
  track(S.db.collection("notices").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.notices=m; render(); }, onErr));
}
function startAdminData(){
  if(S._adminSubs || !isAdmin()) return; S._adminSubs=true;
  track(S.db.collection("stores").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.stores=m; render(); }, e=>console.error(e)));
  track(S.db.doc("settings/fees").onSnapshot(snap=>{ S.fees = snap.exists ? snap.data() : null; render(); }, e=>console.error(e)));
}
const allLoaded = () => S.loaded.members && S.loaded.facilities && S.loaded.patients;

/* ---------- monthly subscription (re-subscribe only when month changes) ---------- */
function subscribeMonth(){
  if(S._subMonth===S.month) return;
  S._subMonth = S.month;
  S.monthUnsub?.(); S.confUnsub?.(); S.rcUnsub?.(); S.plUnsub?.();
  S.receipts={}; S.pl={};
  if(isAdmin()){
    S.rcUnsub = S.db.collection("receipts").where("month","==",S.month).onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.receipts=m; render(); }, e=>console.error(e));
    S.plUnsub = S.db.collection("pl").where("month","==",S.month).onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.pl=m; render(); }, e=>console.error(e));
  }
  S.monthReports=[]; S.monthConfirms={}; S.monthLoaded=false;
  const scope = q => isAdmin() ? q : q.where("staffId","==",S.uid);
  S.monthUnsub = scope(S.db.collection("reports").where("month","==",S.month)).onSnapshot(snap=>{
    S.monthReports = snap.docs.map(d=>({id:d.id,...d.data()})); S.monthLoaded=true; render();
  }, e=>{ console.error(e); S.monthLoaded=true; render(); });
  S.confUnsub = scope(S.db.collection("confirms").where("month","==",S.month)).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ const v=d.data(); m[v.staffId]=v; }); S.monthConfirms=m; render();
  }, e=>console.error(e));
}

/* ---------- daily report loading ---------- */
async function loadDay(){
  S.loadedReport=null; S.sel=new Set(); S.dirty=false;
  const key = `${S.uid}_${S.date}`;
  const want = S.date;
  try{
    const snap = await S.db.collection("reports").doc(key).get();
    if(want!==S.date) return;
    if(snap.exists){ const r=snap.data(); S.loadedReport=r; (r.items||[]).forEach(it=>S.sel.add(it.patientId)); }
  }catch(e){ console.error(e); }
  render();
}

/* ---------- render ---------- */
function render(){
  const app = $("#app");
  if(!S.authReady){ app.innerHTML = shell(`<div class="center"><div class="muted">読み込み中…</div></div>`); return; }
  if(!S.authUser){ app.innerHTML = loginView(); return; }
  if(S.needOwnerSetup){ app.innerHTML = onboarding(); bindOnboarding(); return; }
  if(S.notMember){ app.innerHTML = shell(`<div class="center"><div class="onb card"><h2 style="justify-content:center">このアカウントは使えません</h2><p class="muted">本部でアカウントが登録されていないか、停止されています。本部にご確認ください。</p><button class="btn" data-logout="1" style="margin-top:10px">ログアウト</button></div></div>`); return; }
  if(S.loadError){ app.innerHTML = shell(`<div class="center"><div><p>データを読み込めませんでした。</p><p class="muted">通信状況を確認して、ページを開き直してください。続く場合は本部に連絡してください。</p><button class="btn" data-logout="1">ログアウト</button></div></div>`); return; }
  if(!allLoaded()){ app.innerHTML = shell(`<div class="center"><div class="muted">${S.loadTimeout?"データに接続できません。通信状況を確認してください。":"読み込み中…"}</div></div>`); return; }
  if(!S.me){ app.innerHTML = shell(`<div class="center"><div class="muted">読み込み中…</div></div>`); return; }
  startAdminData();

  const tabs = isAdmin()
    ? [["collect","報告回収"],["news","お知らせ"],["month","月間確認"],["receipt","レセプト"],["pl","売上・PL"],["sales","営業"],["patients","施設・患者"],["settings","設定"]]
    : [["news","お知らせ"],["daily","日報"],["month","月間確認"],["patients","施設・患者"]];
  if(!S.tab || !tabs.some(t=>t[0]===S.tab)) S.tab = tabs[0][0];
  if(S.tab==="daily" && S._dayKey !== S.date){ S._dayKey=S.date; loadDay(); }
  if(["month","reports","collect","receipt","pl","sales"].includes(S.tab)) subscribeMonth();

  let body="";
  if(S.tab==="daily") body = S.recMode ? treatmentEntryView() : dailyView();
  else if(S.tab==="month") body = monthView();
  else if(S.tab==="reports") body = reportsView();
  else if(S.tab==="patients") body = patientsView();
  else if(S.tab==="news") body = newsView();
  else if(S.tab==="members") body = membersView();
  else if(S.tab==="collect") body = collectView();
  else if(S.tab==="receipt") body = receiptView();
  else if(S.tab==="pl") body = plView();
  else if(S.tab==="settings") body = settingsView();
  else if(S.tab==="sales"){ subscribeSales(); body = salesView(); }

  const keep = {}; document.querySelectorAll("input[id]").forEach(i=>keep[i.id]=i.value);
  const focusId = document.activeElement?.id;
  const scrollY = window.scrollY;
  const mx = document.querySelector(".mx-wrap"); const mxs = mx ? [mx.scrollLeft, mx.scrollTop] : null;
  app.innerHTML = shell(`
    <nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("")}</nav>
    <main>${body}</main>
    ${S.tab==="daily"?sendBar():""}`);
  const mx2 = document.querySelector(".mx-wrap"); if(mx2 && mxs){ mx2.scrollLeft=mxs[0]; mx2.scrollTop=mxs[1]; }
  for(const [id,v] of Object.entries(keep)){ const i=document.getElementById(id); if(i && !S._clear?.has(id)) i.value=v; }
  S._clear=null;
  if(focusId){ const f=document.getElementById(focusId); if(f && f.tagName==="INPUT") f.focus(); }
  window.scrollTo(0, scrollY);
}

}
async function logout(){

  const selByFac = {};
  for(const pid of S.sel){ const p=S.patients[pid]; const fid=p?.facilityId ?? (S.loadedReport?.items||[]).find(i=>i.patientId===pid)?.facilityId; (selByFac[fid]=selByFac[fid]||[]).push(pid); }
  const pts = patientsOf(S.curFac);

    ${pts.length ? `<div class="chips vlist">${pts.map(p=>`<div class="ptrow"><button class="chip pt ${S.sel.has(p.id)?"on":""}" data-pt="${p.id}">${esc(p.name)}</button><button class="btn sm ghost" data-consent="${p.id}">同意書</button></div>`).join("")}</div>

function sendBar(){
  const can = S.sel.size>0 && (!S.loadedReport || S.dirty) && !S.sending;
  const label = S.loadedReport ? (S.dirty?"修正して再報告する":"報告済み") : "報告する";
  const clearBtn = S.loadedReport && !S.dirty ? `<button class="btn sm danger" id="cancelReport">この日の報告を取り消す</button>` : `<span class="muted">${S.sel.size}名 選択中</span>`;
  return `<div class="sendbar"><div class="in">${clearBtn}<button class="btn pri" id="send" ${can?"":"disabled"}>${S.sending?"送信中…":label}</button></div></div>`;
}
async function sendReport(){
  if(!S.sel.size) return;
  S.sending=true; render();
  const items = [...S.sel].map(pid=>{ const p=S.patients[pid]; const old=(S.loadedReport?.items||[]).find(i=>i.patientId===pid);
    const fid=p?.facilityId ?? old?.facilityId; return {patientId:pid, patientName:p?.name ?? old?.patientName ?? "", facilityId:fid, facilityName:facName(fid)}; });
  const doc = { staffId:S.uid, staffName:S.me.name, date:S.date, month:S.date.slice(0,7), items, submittedAt:new Date().toISOString() };
  const ok = await safeWrite(()=>S.db.collection("reports").doc(`${S.uid}_${S.date}`).set(doc));
  S.sending=false;
  if(ok){ S.loadedReport=doc; S.dirty=false; toast(`${jpDate(S.date)}の日報を報告しました（${items.length}名）`); cheer(pickCheer()); }
  render();
}

/* ----- monthly ----- */
function monthData(staffId){
  // returns {rows:[{fid, fname, pid, pname, days:{d:count|names}}], dayTotals, total}
  const reps = S.monthReports.filter(r=> staffId==="all" ? true : r.staffId===staffId);
  const rows = new Map(); const dayTotals = {}; let total=0; const workDays=new Set();
  for(const r of reps){
    const day = Number(r.date.slice(8,10));
    if((r.items||[]).length) workDays.add(r.staffId+"_"+day);
    for(const it of (r.items||[])){
      const key = it.patientId;
      if(!rows.has(key)){
        const p=S.patients[it.patientId]; const fid=p?.facilityId ?? it.facilityId;
        rows.set(key,{pid:key, pname:p?.name ?? it.patientName ?? "?", fid, fname:facName(fid) || it.facilityName, days:{}});
      }
      const row=rows.get(key); (row.days[day]=row.days[day]||[]).push(r.staffId);
      dayTotals[day]=(dayTotals[day]||0)+1; total++;
    }
  }
  const order = Object.fromEntries(facList().map((f,i)=>[f.id,i]));
  const list=[...rows.values()].sort((a,b)=>((order[a.fid]??999)-(order[b.fid]??999)) || a.fname.localeCompare(b.fname,"ja") || a.pname.localeCompare(b.pname,"ja"));
  return {rows:list, dayTotals, total, reps, workDays:workDays.size};
}
function monthView(){
  const staff = staffList();
  let sid;
  if(isAdmin()){
    if(!S.monthStaff || (S.monthStaff!=="all" && !S.members[S.monthStaff])) S.monthStaff = staff[0]?.id || "all";
    sid = S.monthStaff;
  } else sid = S.uid;
  const md = monthData(sid);
  const nd = daysIn(S.month); const [y,m]=S.month.split("-").map(Number);
  const dows = Array.from({length:nd},(_,i)=>new Date(y,m-1,i+1).getDay());
  const showNames = sid==="all";
  const initials = id => (S.members[id]?.name||"?").slice(0,1);

  let tbody=""; let lastF=null;
  for(const r of md.rows){

async function toggleConfirm(kind){

async function mergeStaff(from, to){
  toast("移しています…");
  try{
    const reps = await S.db.collection("reports").where("staffId","==",from).get();
    for(const d of reps.docs){ const v=d.data(); const ref=S.db.collection("reports").doc(`${to}_${v.date}`); const cur=await ref.get();
      let items=v.items||[]; if(cur.exists){ const have=new Set((cur.data().items||[]).map(i=>i.patientId)); items=[...(cur.data().items||[]), ...items.filter(i=>!have.has(i.patientId))]; }
      await ref.set({...(cur.exists?cur.data():v), ...v, items, staffId:to, staffName:S.members[to]?.name||v.staffName});
      await S.db.collection("reports").doc(d.id).delete(); }
    const cs = await S.db.collection("confirms").where("staffId","==",from).get();
    for(const d of cs.docs){ const v=d.data(); const ref=S.db.collection("confirms").doc(`${to}_${v.month}`); const cur=await ref.get(); if(!cur.exists) await ref.set({...v, staffId:to}); await S.db.collection("confirms").doc(d.id).delete(); }
    await S.db.collection("members").doc(from).delete();
    S._subMonth=null; toast(`${reps.size}日分の日報を移しました`); render();
  }catch(e){ console.error(e); toast("移せませんでした（"+(e?.code||"エラー")+"）"); }
}

/* ---------- modal ---------- */
function modal({title, body="", input=null, ok="OK", danger=false}){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${body?`<div class="muted">${body}</div>`:""}
      ${input!==null?`<input class="inp" style="width:100%;margin-top:10px" value="${esc(input)}">`:""}
      <div class="acts"><button class="btn ghost" data-x="0">キャンセル</button><button class="btn ${danger?"danger":"pri"}" data-x="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const inp=bg.querySelector("input"); inp?.focus();
    const close=v=>{ bg.remove(); res(v); };
    bg.addEventListener("click",e=>{ if(e.target===bg) close(null); const x=e.target.closest("[data-x]"); if(x) close(x.dataset.x==="1" ? (inp?inp.value.trim():true) : null); });
    inp?.addEventListener("keydown",e=>{ if(e.key==="Enter") close(inp.value.trim()); });
  });
}

// 料金：令和8年度改定の額。設定画面で変更できる。
const DEFAULT_FEES = {
  shoken:[2000,2320], sejutsu:[1650,1820],
  houmon1:[3950,4120], houmon2:[2800,2970], houmon3:[2110,2280], houmon4:[1800,1970], houmon5:[1720,1890],

};
const fees = () => { const f={...DEFAULT_FEES}; const s=S.fees||{}; if(s.version!=="R8") return f; for(const k in s) if(s[k]!==undefined&&s[k]!==null) f[k]=s[k]; return f; };
const HOUMON_LABEL = {1:"訪問施術料1（1人）",2:"訪問施術料2（2人）",3:"訪問施術料3（3〜9人）",4:"訪問施術料4（10〜19人）",5:"訪問施術料5（20人以上）"};
const DISEASES = ["神経痛","リウマチ","頸腕症候群","五十肩","腰痛症","頸椎捻挫後遺症","その他"];
const EXP = [["labor","人件費"],["rent","家賃"],["travel","交通費・車両費"],["supply","消耗品費"],["utility","水道光熱費"],["comm","通信費"],["ad","広告宣伝費"],["other","その他"]];

function wareki(s, withDay=true){
  if(!s) return "";
  const d = parseYmd(s.length===7 ? s+"-01" : s); const y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
  const eras=[["令和",new Date(2019,4,1),2018],["平成",new Date(1989,0,8),1988],["昭和",new Date(1926,11,25),1925],["大正",new Date(1912,6,30),1911],["明治",new Date(1868,0,25),1867]];
  for(const [n,st,off] of eras) if(+d>=+st){ const yy=y-off; return `${n}${yy===1?"元":yy}年${m}月${withDay?dd+"日":""}`; }
  return s;
}

/* ----- 月の計算（報告 → レセプト） ----- */
function computeMonth(){
  const F = fees(); const out = {}; const cnt = {};
  for(const r of S.monthReports) for(const it of (r.items||[])){
    const p=S.patients[it.patientId]; const fid=p?.facilityId ?? it.facilityId;
    if(fid===HOME_ID) continue;
    const k=r.staffId+"|"+r.date+"|"+fid; cnt[k]=(cnt[k]||0)+1;
  }
  for(const r of S.monthReports) for(const it of (r.items||[])){
    const pid=it.patientId; const p=S.patients[pid] || {name:it.patientName||"?", facilityId:it.facilityId};
    const fid=p.facilityId ?? it.facilityId;
    const o = out[pid] || (out[pid] = {pid, p, fid, days:[], staffDays:{}});
    const n = fid===HOME_ID ? 1 : (cnt[r.staffId+"|"+r.date+"|"+fid]||1);
    if(!o.days.some(d=>d.date===r.date)) o.days.push({date:r.date, n, staffId:r.staffId});
    o.staffDays[r.staffId]=(o.staffDays[r.staffId]||0)+1;
  }
  const list = Object.values(out);
  for(const o of list){
    o.days.sort((a,b)=>a.date.localeCompare(b.date));
    const saved = S.receipts[`${o.pid}_${S.month}`]; const ov = saved?.opts || {};
    const p=o.p;
    const opt = {
      jutsu: ov.jutsu || p.jutsu || "1",
      denryo: ov.denryo ?? !!p.denryo,
      tokubetsu: ov.tokubetsu ?? !!p.tokubetsu,
      report: ov.report ?? false,
      shoken: ov.shoken ?? (!!p.firstDate && p.firstDate.slice(0,7)===S.month),
      visit: p.visit || "訪問",
      meisai: ov.meisai ?? (p.meisai ?? true),
      hokengai: Number(ov.hokengai)||0,
    };
    const j = opt.jutsu==="2" ? 1 : 0; const jl = opt.jutsu==="2" ? "2術" : "1術";
    const lines=[]; const add=(key,label,unit,count,half=false)=>{ if(count>0) lines.push({key,label:half?label+"（16回目以降・半額）":label,unit,count,amount:unit*count,half}); };
    const halfOn = F.half16!=="0";
    const tally={}; const bump=(k,unit,half)=>{ const kk=k+(half?"_h":""); (tally[kk]=tally[kk]||{k,unit,half,c:0}).c++; };
    o.days.forEach((d,idx)=>{
      const half = halfOn && idx>=15; const hf = v => half ? Math.floor(v/2) : v;
      if(opt.visit==="通所") bump("sejutsu", hf(F.sejutsu[j]), half);
      else { const tier = d.n<=1?1:d.n===2?2:d.n<10?3:d.n<20?4:5; bump("h"+tier, hf(F["houmon"+tier][j]), half); }
      if(opt.denryo) bump("denryo", hf(F.denryo), half);
      if(opt.tokubetsu) bump("tokubetsu", F.tokubetsu, false);
    });
    if(opt.shoken) add("shoken",`初検料（${jl}）`, F.shoken[j], 1);
    const lbl = k => k==="sejutsu"?`施術料・通所（${jl}）`: k[0]==="h"?`${HOUMON_LABEL[k[1]]}・${jl}`: k==="denryo"?"電療料":"特別地域加算";
    ["sejutsu","h1","h2","h3","h4","h5","denryo","tokubetsu"].forEach(k=>{ [false,true].forEach(h=>{ const t=tally[k+(h?"_h":"")]; if(t) add(k,lbl(k),t.unit,t.c,h); }); });
    if(opt.meisai && o.days.length) add("meisai","明細書発行加算",F.meisai,1);
    if(opt.report) add("report","施術報告書交付料",F.report,1);
    o.total = lines.reduce((a,l)=>a+l.amount,0);
    const rate = (p.burden===undefined||p.burden==="") ? 0.1 : Number(p.burden)/10;
    let b = o.total*rate; b = F.rounding==="10" ? Math.round(b/10)*10 : Math.floor(b);
    o.opt=opt; o.lines=lines; o.burden=b; o.claim=o.total-b; o.hokengai=opt.hokengai; o.selfTotal=b+opt.hokengai;
    o.staffId = Object.entries(o.staffDays).sort((a,b)=>b[1]-a[1])[0]?.[0];
    o.storeId = storeOfStaff(o.staffId);
    o.missing = [["insurerNo","保険者番号"],["bango","記号・番号"],["burden","負担割合"],["birth","生年月日"],["disease","傷病名"],["consentDoctor","同意医師"],["consentDate","同意日"]].filter(([k])=>!p[k]).map(x=>x[1]);
    o.saved = saved || null;
    o.changed = saved ? (saved.total!==o.total || saved.days!==o.days.length) : false;
  }
  const order = Object.fromEntries(facList().map((f,i)=>[f.id,i]));
  return list.sort((a,b)=> String(storeName(a.storeId)).localeCompare(storeName(b.storeId),"ja") || (order[a.fid]??99)-(order[b.fid]??99) || String(a.p.name).localeCompare(b.p.name,"ja"));
}

    const doc = {month:S.month, patientId:o.pid, patientName:o.p.name, storeId:o.storeId||"", staffId:o.staffId||"", facilityId:o.fid,
      days:o.days.length, dates:o.days.map(d=>d.date), lines:o.lines, total:o.total, burden:o.burden, claim:o.claim,

  }
  toast(`${list.length}件のレセプトを確定しました`);
}

function showDoc(html, fname){
  // 別ウィンドウは使わず、画面内のプレビューで開く（ブラウザによって別ウィンドウが開かず反応しないため）
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.style.zIndex=9999;
  bg.innerHTML=`<div class="modal" style="max-width:900px;width:96vw;height:94vh;padding:10px;display:flex;flex-direction:column">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>印刷プレビュー</b><div class="row"><button class="btn sm pri" data-dp="1">印刷する</button><button class="btn sm ghost" data-dp="0">閉じる</button></div></div>
    <iframe style="flex:1;border:1px solid #ccd;border-radius:8px;background:#eee"></iframe></div>`;
  document.body.appendChild(bg);
  const fr=bg.querySelector("iframe"); fr.srcdoc=html.replace(/<script>window\.addEventListener\("load"[\s\S]*?<\/script>/,"");
  bg.addEventListener("click",e=>{ const b=e.target.closest("[data-dp]"); if(!b && e.target!==bg) return;
    if(b && b.dataset.dp==="1"){ try{ fr.contentWindow.print(); }catch(err){ toast("この画面では印刷できません（本番アプリでは印刷できます）"); return; } bg.remove(); return; }
    bg.remove(); });
}

/* ----- 施術録（施術ごとに記入し、必要時に印刷） ----- */
const TREAT_JUTSU = ["1術（はり又はきゅう）","2術（はり・きゅうの併用）"];

/* ----- 施術録の入力画面（報告の前に、選んだ患者ごとに記入） ----- */
async function enterRecMode(){
  if(!S.sel.size){ toast("先に患者を選んでください"); return; }
  const cache={};
  await Promise.all([...S.sel].map(async pid=>{
    const p=S.patients[pid]; if(!p) return;
    let today=null, prev=null;
    try{
      const snap=await S.db.collection("treatmentRecords").where("patientId","==",pid).get();
      const recs=snap.docs.map(d=>({id:d.id,...d.data()}));
      today=recs.find(r=>r.date===S.date)||null;
      prev=recs.filter(r=>r.date<S.date).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
    }catch(e){ console.error(e); }
    cache[pid]={
      jutsu: today?.jutsu || p.treatJutsu || prev?.jutsu || TREAT_JUTSU[0],
      disease: today ? (today.disease||"") : (p.treatDisease || prev?.disease || ""),
      progress: today ? (today.progress||"") : (prev?.progress||""),
      progPrev: !today && !!prev,
      note: today?.note||"", saved: !!today };
  }));
  S._rec=cache; S.recMode=true; render(); window.scrollTo(0,0);
}

function readRecCard(pid){
  const card=document.querySelector(`[data-card="${pid}"]`); if(!card) return null;
  const v=k=>(card.querySelector(`[data-f="${k}"]`)?.value||"").trim();
  return { jutsu:card.querySelector('[data-f="jutsu"]')?.value||TREAT_JUTSU[0], disease:v("disease"), progress:v("progress"), note:v("note") };
}
async function saveRecCard(pid, print){
  const p=S.patients[pid]; const v=readRecCard(pid); if(!p||!v) return null;
  if(!v.progress){ toast("症状ならびに経過を入力してください"); return null; }
  const doc={ ...v, patientId:pid, patientName:p.name, facilityId:p.facilityId||"", date:S.date, updatedAt:new Date().toISOString(), updatedBy:S.uid };
  const ok = await safeWrite(()=>S.db.doc(`treatmentRecords/${pid}_${S.date}`).set(doc), "施術録を保存しました");
  if(!ok) return null;
  try{ await S.db.collection("patients").doc(pid).update({treatJutsu:v.jutsu, treatDisease:v.disease}); }catch(e){ console.error(e); }
  // 再描画せず、そのカードだけ更新（入力中の他の人の内容を消さないため）
  const card=document.querySelector(`[data-card="${pid}"]`);
  if(card){ card.querySelector("textarea")?.classList.remove("prev");
    if(!card.querySelector(".rh .badge")) card.querySelector(".rh").insertAdjacentHTML("beforeend",'<span class="badge info">保存済</span>'); }
  if(print) printTreatmentRecords([{p, rec:doc, date:S.date}]);
  return doc;
}
async function printAllRec(){
  const list=[];
  for(const pid of S.sel){ const p=S.patients[pid]; const v=readRecCard(pid); if(!p||!v) continue;
    if(!v.progress){ toast(`${p.name} さんの症状ならびに経過が空欄です`); return; }
    list.push({p, rec:{...v, updatedAt:new Date().toISOString(), updatedBy:S.uid}, date:S.date}); }
  if(list.length) printTreatmentRecords(list);
}

/* ----- 同意書の更新（期限と原本写真を入れる → 本部が原本回収で完了） ----- */
function compressImg(file){
  return new Promise((res,rej)=>{ const img=new Image();
    img.onload=()=>{ const max=1200; const r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.75)); };
    img.onerror=rej; img.src=URL.createObjectURL(file); });
}

/* ----- 同意書（初回の同意・再同意を1枚で切り替え。患者ごとに保存して印刷） ----- */
const CONSENT_DISEASES=["神経痛","リウマチ","頸腕症候群","五十肩","腰痛症","頸椎捻挫後遺症"];
/* ----- 同意書の期限（同意日から6か月。2か月前・1か月前にお知らせ） ----- */
const addMonthsSafe = (d,n) => { const x=new Date(d); const day=x.getDate(); x.setMonth(x.getMonth()+n); if(x.getDate()!==day) x.setDate(0); return x; };
const consentEnd = p => { const x=p.consent?.expiry; if(x) return parseYmd(x); const s=p.consent?.signed; if(!s) return null; const e=addMonthsSafe(parseYmd(s),6); e.setDate(e.getDate()-1); return e; };
const consentAlert = p => { const e=consentEnd(p); if(!e) return null; const t=new Date(); t.setHours(0,0,0,0);
  if(t>e) return {lv:"expired", e}; if(t>=addMonthsSafe(e,-1)) return {lv:"1m", e}; if(t>=addMonthsSafe(e,-2)) return {lv:"2m", e}; return null; };
function consentAlertsHtml(){
  const items = Object.entries(S.patients||{}).filter(([id,p])=>p.active!==false)
    .map(([id,p])=>({id,p,a:consentAlert(p)})).filter(x=>x.a).sort((a,b)=>a.a.e-b.a.e);
  if(!items.length) return "";
  const col = {expired:"#c0392b", "1m":"#c0392b", "2m":"#b7950b"};
  return `<section class="card" style="padding:10px 12px">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px">
    ${items.map(({id,p,a})=>`<div style="border:1px solid #e3e8f2;border-radius:8px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div style="min-width:0">
        <div style="font-size:14px;line-height:1.3"><b>${esc(p.name)}</b> <span class="muted" style="font-size:11px">${esc(facName(p.facilityId))}</span></div>
        <div style="color:${col[a.lv]};font-weight:700;font-size:12px;margin-top:2px">有効期限　${esc(wareki(ymd(a.e)))}</div>
      </div>
      <div style="display:flex;gap:6px;flex:none"><button class="btn sm ghost" style="padding:2px 8px;font-size:12px" data-consent="${id}">同意書</button><button class="btn sm ghost" style="padding:2px 8px;font-size:12px" data-renew="${id}">更新</button></div></div>`).join("")}
    </div></section>`;
}
async function openConsentForm(pid, opts={}){
  const p=S.patients[pid]; if(!p) return;
  const c=p.consent||{};
  const diseases = c.diseases || [];
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.style.zIndex=9000;
  const facTxt = p.facilityId && p.facilityId!==HOME_ID ? facName(p.facilityId) : "";
  bg.innerHTML=`<div class="modal" style="max-width:520px;width:94vw;max-height:90vh;overflow:auto;padding:14px">
    <h3 style="margin:0 0 8px">${esc(p.name)}${facTxt?`<span class="muted" style="font-size:13px;margin-left:8px">${esc(facTxt)}</span>`:""}</h3>
    <label class="f">同意区分</label>
    <div class="row" style="gap:16px">
      <label><input type="radio" name="kind" value="初回の同意"> 初回の同意</label>
      <label><input type="radio" name="kind" value="再同意" checked> 再同意</label>
    </div>
    ${(()=>{ const cl=S.clinics?.[p.clinicId]; return cl ? `<div class="muted" style="font-size:13px;margin-top:8px">医療機関：<b>${esc(cl.name)}</b></div>` : `<div style="color:#c0392b;font-size:13px;margin-top:8px">この患者の医療機関が未設定です。患者情報で医療機関を選んでください</div>`; })()}
    <label class="f" style="margin-top:10px">病名（該当するものに✓）</label>
    ${CONSENT_DISEASES.map((n,i)=>`<label style="display:block"><input type="checkbox" data-dis="${i+1}" ${diseases.includes(i+1)?"checked":""}> ${i+1}．${n}</label>`).join("")}
    <label style="display:block"><input type="checkbox" data-dis="7" ${diseases.includes(7)?"checked":""}> 7．その他</label>
    <label class="f">その他の病名（7を選んだ場合）</label>
    <input class="inp w" data-c="other" value="${esc(c.other||"")}">
    <label class="f">発病年月日</label>
    <label class="ck"><input type="checkbox" data-c="unk" ${c.onset?"":"checked"}> 不詳</label>
    <input class="inp w" type="date" data-c="onset" value="${esc(c.onset||"")}" style="margin-top:4px" oninput="if(this.value){const u=this.closest('.modal')?.querySelector('[data-c=unk]'); if(u) u.checked=false;}">
    <label class="f" style="margin-top:10px">注意事項等（任意）</label>
    <textarea class="inp w" rows="3" data-c="note">${esc(c.note||"")}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px">
      <button class="btn sm ghost" data-cx="close">閉じる</button>
      <button class="btn sm pri" data-cx="print">印刷</button>
    </div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", async e=>{
    const b=e.target.closest("[data-cx]"); if(!b && e.target!==bg) return;
    if(!b || b.dataset.cx==="close"){ bg.remove(); return; }
    const data=readConsentForm(bg); if(!data) return;
    if(!S.clinics?.[p.clinicId]){ toast("患者情報で医療機関を設定してください"); return; }
    S.db.collection("patients").doc(pid).update({consent:{...(p.consent||{}), ...data, expiry:""}}).catch(err=>console.error(err));
    p.consent={...(p.consent||{}), ...data, expiry:""};
    bg.remove();
    showDoc(consentHtml(p,data));
  });
}
function readConsentForm(bg){
  const diseases=[...bg.querySelectorAll("[data-dis]:checked")].map(i=>Number(i.dataset.dis));
  const v=k=>(bg.querySelector(`[data-c="${k}"]`)?.value||"").trim();
  const blank = false;
  if(!blank && !diseases.length){ toast("病名を1つ以上選んでください"); return null; }
  return { blank, kind: bg.querySelector('input[name="kind"]:checked')?.value||"初回の同意", diseases,
    other:v("other"), onset: bg.querySelector('[data-c="unk"]')?.checked ? "" : v("onset"), exam:"", note:v("note") };
}

function consentHtml(p, c){
  const st = S.clinics?.[p.clinicId] || {};
  const mm = v => (v/5.91).toFixed(2)+"mm";
  const at = (x,y,txt,extra="") => `<div class="f" style="left:${mm(x)};top:${mm(y)};transform:translateY(-50%);${extra}">${txt}</div>`;
  const ring = (cx,cy,rx,ry) => `<div class="ring" style="left:${mm(cx-rx)};top:${mm(cy-ry)};width:${mm(rx*2)};height:${mm(ry*2)}"></div>`;
  const cover = (x,y,w,h) => `<div class="cov" style="left:${mm(x)};top:${mm(y)};width:${mm(w)};height:${mm(h)}"></div>`;
  const dis = c.diseases||[];
  let f = "";
  f += at(515,253,esc(p.address||""));
  f += at(515,300,esc(p.name||""));
  const wparts = s => { const m = /^(明治|大正|昭和|平成|令和)(元|\d+)年(\d+)月(\d+)日$/.exec(s||""); return m ? {e:m[1][0], y:m[2]==="元"?"元":m[2], mo:m[3], d:m[4]} : null; };
  const atR = (xr,y,txt) => `<div class="f" style="right:${mm(1241-xr)};top:${mm(y)};transform:translateY(-50%)">${txt}</div>`;
  const dateFill = (str, y, eraMap, ax) => { const w = wparts(str); if(!w) return ""; let h = ""; if(eraMap[w.e]) { const [ex,ey,erx,ery]=eraMap[w.e]; h += ring(ex,ey,erx,ery); } return h + atR(ax[0],y,w.y) + atR(ax[1],y,w.mo) + atR(ax[2],y,w.d); };
  if(p.birth){ f += dateFill(wareki(p.birth), 343, {"明":[540.25,340.75,14.75,15.75],"大":[599.75,340.25,15.75,15.75],"昭":[659.25,340.75,15.25,15.75],"平":[719,340.75,15,15.75],"令":[778,340.25,15,16.25]}, [878,1000,1120]); }

  if(dis.includes(7)){ f += ring(315,762,19,15.5); if(c.other) f += at(455,761,esc(c.other)); }
  const onsetStr = c.onset ? wareki(c.onset) : "";
  if(onsetStr){ f += dateFill(onsetStr, 892, {"昭":[387,893.75,15.5,15.75],"平":[446.5,893.75,15.5,15.75],"令":[507,893.25,14,16.25]}, [640,780,925]); }

/* ----- 汎用フォームモーダル ----- */
function formModal(title, html, ok="保存", wide=false){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML=`<form class="modal" style="max-width:${wide?640:440}px;max-height:92vh;overflow:auto"><h3>${esc(title)}</h3>${html}
      <div class="acts"><button type="button" class="btn ghost" data-x="0">キャンセル</button><button type="submit" class="btn pri">${esc(ok)}</button></div></form>`;
    document.body.appendChild(bg);
    const form=bg.querySelector("form");
    const close=v=>{ bg.remove(); res(v); };
    form.addEventListener("submit",e=>{ e.preventDefault(); const fd=new FormData(form); const o={}; for(const [k,v] of fd.entries()) o[k]=typeof v==="string"?v.trim():v; close(o); });
    bg.addEventListener("click",async e=>{
      if(e.target===bg) close(null);
      if(e.target.closest("[data-x='0']")) close(null);
      const ds2=e.target.closest("[data-delsale]");
      if(ds2){ e.preventDefault(); const id=ds2.dataset.delsale; close(null);
        const ok=await modal({title:"この営業記録を削除しますか？", ok:"削除", danger:true});
        if(ok) await safeWrite(()=>S.db.collection("sales").doc(id).delete(), "削除しました"); return; }
      const dfm=e.target.closest("[data-delfacm]");
      if(dfm){ e.preventDefault(); close(null); deleteFacility(dfm.dataset.delfacm); return; }
      const del=e.target.closest("[data-delstore]");
      if(del){ e.preventDefault(); const id=del.dataset.delstore; close(null);
        const ok=await modal({title:`「${storeName(id)}」を削除しますか？`, body:"所属している施術者は「店舗未設定」になります。", ok:"削除", danger:true});
        if(ok) await safeWrite(()=>S.db.collection("stores").doc(id).delete(), "削除しました"); }
    });
  });
}

/* ----- アカウント発行 ----- */
const genPass = () => { const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let p=""; const a=new Uint32Array(10); crypto.getRandomValues(a); a.forEach(x=>p+=c[x%c.length]); return p; };
async function issueAccount(){
  const pw = genPass();
  const v = await formModal("アカウントを発行", `
    <label class="f">名前 *</label><input class="inp w" name="name" placeholder="例：坂本 隼人">
    <label class="f">メールアドレス（ログインID） *</label><input class="inp w" name="email" type="email" placeholder="例：sakamoto@example.com">
    <label class="f">初期パスワード（10文字）</label><input class="inp w" name="password" value="${pw}" style="font-family:ui-monospace,monospace;letter-spacing:.05em">
    <div class="fgrid">
      <div><label class="f">役割</label><select class="inp w" name="role"><option value="staff">施術者</option>${S.isOwner?`<option value="admin">管理者</option>`:""}</select></div>
      <div><label class="f">店舗</label><select class="inp w" name="storeId"><option value="">未設定</option>${storeList().map(st=>`<option value="${st.id}">${esc(st.name)}</option>`).join("")}</select></div>
    </div>
    <p class="muted" style="font-size:12px">発行後、このメールアドレスと初期パスワードを本人に伝えてください。本人はログイン後「パスワード再設定」で自分のパスワードに変えられます。</p>`, "発行する");
  if(!v) return;
  if(!v.name || !v.email){ toast("名前とメールアドレスを入力してください"); return; }
  if((v.password||"").length<8){ toast("パスワードは8文字以上にしてください"); return; }
  let newUid;
  if(S.local){ newUid = "u-"+rid(); }
  else{
    toast("発行しています…");
    const sec = FB.appM.initializeApp(FIREBASE_CONFIG, "issuer-"+Date.now());
    try{
      const sAuth = FB.authM.initializeAuth(sec, {persistence: FB.authM.inMemoryPersistence});
      const cred = await FB.authM.createUserWithEmailAndPassword(sAuth, v.email, v.password);
      newUid = cred.user.uid; await FB.authM.signOut(sAuth);
    }catch(e){
      const c=e?.code||"";
      toast(c.includes("email-already-in-use")?"このメールアドレスはすでに登録されています":c.includes("invalid-email")?"メールアドレスの形が正しくありません":c.includes("weak-password")?"パスワードが弱すぎます（8文字以上）":"発行できませんでした（"+c+"）");
      try{ await FB.appM.deleteApp(sec); }catch(_){}
      return;
    }
    try{ await FB.appM.deleteApp(sec); }catch(_){}
  }
  const ok = await safeWrite(()=>S.db.collection("members").doc(newUid).set({name:v.name, email:v.email, storeId:v.storeId||"", active:true, createdAt:new Date().toISOString(), createdBy:S.uid}));
  if(!ok) return;
  if(v.role==="admin" && S.isOwner){ const set=new Set(S.admins||[]); set.add(newUid); await safeWrite(()=>S.db.doc("config/roles").set({...(S.roles||{}), owner:S.roles?.owner||S.uid, admins:[...set]})); }
  const url = location.href.split("#")[0].split("?")[0];
  const text = `${APP_NAME} のアカウントです\nURL：${url}\nメール：${v.email}\n初期パスワード：${v.password}\n※ログイン後、パスワードを変更してください。`;
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal"><h3>発行しました</h3><p class="muted">この内容を ${esc(v.name)} さんに送ってください。この画面を閉じるとパスワードは再表示できません。</p>
    <textarea class="inp w" rows="6" readonly style="font-family:ui-monospace,monospace;font-size:13px">${esc(text)}</textarea>
    <div class="acts"><button class="btn" data-cp="1">コピー</button><button class="btn pri" data-cl="1">閉じる</button></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", async e=>{ if(e.target.closest("[data-cp]")){ try{ await navigator.clipboard.writeText(text); toast("コピーしました"); }catch(_){ bg.querySelector("textarea").select(); toast("選択しました。長押しでコピーしてください"); } } if(e.target.closest("[data-cl]")) bg.remove(); });
}
async function resetPw(id){

async function toggleActive(id){
  const m=S.members[id]; const stop = m.active!==false;
  const ok=await modal({title: stop?`${m.name} さんのアカウントを停止しますか？`:`${m.name} さんのアカウントを再開しますか？`, body: stop?"停止するとログインしてもデータを見られなくなります。これまでの記録は残ります。":"", ok: stop?"停止":"再開", danger:stop}); if(!ok) return;
  await safeWrite(()=>S.db.collection("members").doc(id).update({active:!stop}), stop?"停止しました":"再開しました");
}

/* ----- ファイル保存・バックアップ ----- */
function saveFile(name, content, type="application/json"){
  const url=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
const BACKUP_COLS=["members","facilities","patients","stores","settings","reports","confirms","receipts","pl","sales","treatmentRecords"];
async function exportBackup(){
  toast("バックアップを作っています…");
  try{
    const data={};
    for(const c of BACKUP_COLS){ const snap=await S.db.collection(c).get(); data[c]=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); }
    const now=new Date();
    saveFile(`${APP_NAME}_バックアップ_${ymd(now)}.json`, JSON.stringify({app:BRAND.appId, version:1, exportedAt:now.toISOString(), data}, null, 1));
    await S.db.doc("settings/backup").set({lastAt:now.toISOString(), by:S.uid});
    const n=Object.values(data).reduce((a,o)=>a+Object.keys(o).length,0);
    toast(`${n}件のデータを保存しました`);
  }catch(e){ console.error(e); toast("バックアップできませんでした（"+(e?.code||"エラー")+"）"); }
}
async function importBackup(file){
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ toast("ファイルを読み込めませんでした"); return; }
  if(j?.app!==BRAND.appId || !j.data){ toast(`${APP_NAME}のバックアップファイルではありません`); return; }
  const counts=BACKUP_COLS.map(c=>[c,Object.keys(j.data[c]||{}).length]).filter(x=>x[1]);
  const total=counts.reduce((a,x)=>a+x[1],0);
  const label={members:"メンバー",facilities:"施設",patients:"患者",stores:"店舗",settings:"設定",reports:"日報",confirms:"本部報告",receipts:"レセプト",pl:"PL",sales:"営業",treatmentRecords:"施術録"};
  const ok=await modal({title:"バックアップから復元しますか？", body:`${j.exportedAt?new Date(j.exportedAt).toLocaleString("ja-JP")+" 時点の":""}データ ${total}件を書き込みます。<br>${counts.map(([c,n])=>`${label[c]||c} ${n}件`).join("・")}<br><b>同じデータがある場合は、ファイルの内容で上書きされます。</b>`, ok:"復元する", danger:true});
  if(!ok) return;
  let done=0;
  for(const [c] of counts){
    for(const [id,doc] of Object.entries(j.data[c])){
      if(c==="members" && id===S.uid) { done++; continue; }
      try{ await S.db.collection(c).doc(id).set(doc); }catch(e){ console.error(c,id,e); toast(`途中で止まりました（${label[c]||c}）。${done}件まで復元済み`); return; }
      done++; if(done%10===0) toast(`復元中… ${done}/${total}`);
    }
  }
  toast(`${done}件を復元しました`); S._subMonth=null; render();
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if(!t) return;
  const ds = t.dataset;

  if(ds.obrole){ S._obRole=ds.obrole; S._obName=$("#obName")?.value||S._obName; render(); return; }
  if(t.id==="obGo"){
    const name=($("#obName").value||"").trim(); if(!name){ toast("お名前を入力してください"); return; }
    let exists=false; try{ const r=await S.db.doc("config/roles").get(); exists=r.exists && r.data().owner===S.uid; }catch(e){ toast("通信できませんでした。もう一度お試しください"); return; }
    if(!exists){ const ok1 = await safeWrite(()=>S.db.doc("config/roles").set({owner:S.uid, admins:[]})); if(!ok1) return; }
    const ok2 = await safeWrite(()=>S.db.collection("members").doc(S.uid).set({name, email:S.authUser?.email||"", active:true, createdAt:new Date().toISOString()}), "登録しました");
    if(ok2){ S.needOwnerSetup=false; await afterLogin(); }
    return;
  }
  if(ds.logout){ logout(); return; }
  if(ds.forgot){ forgotPassword(); return; }
  if(ds.tab){ if(S.tab==="daily" && S.dirty && ds.tab!=="daily"){ const ok=await modal({title:"未報告の変更があります", body:"報告せずに移動すると、選択内容は消えます。", ok:"移動する"}); if(!ok) return; S._dayKey=null; }
    S.recMode=false; S.tab=ds.tab; render(); window.scrollTo(0,0); return; }

  // daily
  if(ds.day){
    if(S.dirty){ const ok=await modal({title:"未報告の変更があります", body:"日付を変えると、選択内容は消えます。", ok:"変更する"}); if(!ok) return; }
    if(ds.day==="today") S.date=ymd(new Date()); else { const d=parseYmd(S.date); d.setDate(d.getDate()+Number(ds.day)); if(ymd(d)>ymd(new Date())) return; S.date=ymd(d); }
    render(); return;
  }
  if(ds.fac){ S.curFac=ds.fac; render(); return; }
  if(ds.pt){ S.sel.has(ds.pt)?S.sel.delete(ds.pt):S.sel.add(ds.pt); S.dirty=true; render(); return; }
  if(ds.allfac){ patientsOf(ds.allfac).forEach(p=>S.sel.add(p.id)); S.dirty=true; render(); return; }
  if(ds.clearfac){ patientsOf(ds.clearfac).forEach(p=>S.sel.delete(p.id)); S.dirty=true; render(); return; }
  if(ds.gotoPatients){ S.ptFac=ds.gotoPatients; S.tab="patients"; render(); return; }
  if(t.id==="send"){ sendReport(); return; }
  if(t.id==="cancelReport"){
    const ok=await modal({title:`${jpDate(S.date)}の報告を取り消しますか？`, body:"管理者側からもこの日の報告が消えます。", ok:"取り消す", danger:true}); if(!ok) return;
    if(await safeWrite(()=>S.db.collection("reports").doc(`${S.uid}_${S.date}`).delete(), "報告を取り消しました")){ S.loadedReport=null; S.sel=new Set(); S.dirty=false; render(); }
    return;
  }

  // 本部
  if(ds.issue){ issueAccount(); return; }
  if(ds.resetpw){ resetPw(ds.resetpw); return; }
  if(ds.toggleactive){ toggleActive(ds.toggleactive); return; }
  if(ds.backup){ exportBackup(); return; }
  if(ds.editsale!==undefined){ editSale(ds.editsale); return; }
  if(ds.saledone){ await safeWrite(()=>S.db.collection("sales").doc(ds.saledone).update({nextDone:true}), "済みにしました"); return; }
  if(ds.receive){ receiveStaff(ds.receive); return; }
  if(ds.recenter){ enterRecMode(); return; }
  if(ds.recback){ S.recMode=false; render(); window.scrollTo(0,0); return; }
  if(ds.recsave){ saveRecCard(ds.recsave,false); return; }
  if(ds.recprint){ saveRecCard(ds.recprint,true); return; }
  if(ds.recprintall){ printAllRec(); return; }
  if(ds.consent){ openConsentForm(ds.consent); return; }
  if(ds.renew){ openRenewForm(ds.renew); return; }
  if(ds.scan){ openScan(ds.scan); return; }
  if(ds.origdone){ origDone(ds.origdone); return; }
  if(ds.newnotice){ openNoticeForm(); return; }
  if(ds.newclinic){ editClinic(null); return; }
  if(ds.editclinic){ editClinic(ds.editclinic); return; }
  if(ds.delclinic){ const ok=await modal({title:"この医療機関を削除しますか？", body:"患者に紐づいている場合は、患者ごとに選び直してください。", ok:"削除する"}); if(ok) await safeWrite(()=>S.db.collection("clinics").doc(ds.delclinic).delete(), "削除しました"); return; }
  if(ds.delnotice){ const ok=await modal({title:"このお知らせを削除しますか？", body:"", ok:"削除する"}); if(ok) await safeWrite(()=>S.db.collection("notices").doc(ds.delnotice).delete(), "削除しました"); return; }
  if(ds.viewstaff){ S.monthStaff=ds.viewstaff; S.tab="month"; render(); window.scrollTo(0,0); return; }
  if(ds.rcconfirm){ confirmReceipts(); return; }
  if(ds.slipprint){ printSlips(ds.slipprint); return; }
  if(ds.rcprint){ printReceipts(null); return; }
  if(ds.rcedit){ editReceiptOpts(ds.rcedit); return; }
  if(ds.rcpreview){ previewReceipt(ds.rcpreview); return; }
  if(ds.editpt){ editPatient(ds.editpt); return; }
  if(ds.settab){ S.setTab=ds.settab; render(); return; }
  if(ds.editstore!==undefined){ editStore(ds.editstore); return; }
  if(t.id==="saveFees"){
    const f={}; document.querySelectorAll("[data-fee]").forEach(i=>{ const [k,idx]=i.dataset.fee.split("."); if(k==="rounding"||k==="half16"){ f[k]=i.value; return; } const n=Number(String(i.value).replace(/[^\d]/g,""))||0; if(idx!==undefined){ (f[k]=f[k]||[0,0])[Number(idx)]=n; } else f[k]=n; });
    f.version="R8"; await safeWrite(()=>S.db.doc("settings/fees").set(f), "料金表を保存しました"); return;
  }
  if(t.id==="resetFees"){ const ok=await modal({title:"料金表を初期値に戻しますか？", body:"令和8年度改定の額に戻ります。", ok:"戻す"}); if(!ok) return; await safeWrite(()=>S.db.doc("settings/fees").set({...DEFAULT_FEES}), "初期値に戻しました"); return; }

  // month
  if(ds.month){ S.month=addMonth(S.month, Number(ds.month)); render(); return; }
  if(ds.confirm){ toggleConfirm(ds.confirm); return; }

  // facilities / patients
  if(ds.ptfac){ S.ptFac=ds.ptfac; render(); return; }
  if(ds.newfac){ editFacility(null, ds.newfac); return; }
  if(ds.editfac){ editFacility(ds.editfac); return; }
  if(t.id==="addPt"){
    const name=($("#newPt").value||"").trim(); const kana=($("#newPtKana").value||"").trim();

    $("#newPt").value=""; $("#newPtKana").value=""; S._clear=new Set(["newPt","newPtKana"]);
    await safeWrite(()=>S.db.collection("patients").doc(rid()).set({name, kana, facilityId:S.ptFac, active:true, createdBy:S.uid}), `${name} さんを追加しました`);
    setTimeout(()=>$("#newPt")?.focus(),50);
    return;
  }
  if(ds.delpt){
    const p=S.patients[ds.delpt];
    const ok=await modal({title:`${p.name} さんを削除しますか？`, body:"これまでの報告記録は残ります。", ok:"削除", danger:true}); if(!ok) return;
    await safeWrite(()=>S.db.collection("patients").doc(ds.delpt).update({active:false}), "削除しました");
    return;
  }
  if(ds.delfac){ deleteFacility(ds.delfac); return; }
  // members
  if(ds.renamemem){
    const m=S.members[ds.renamemem]; const v=await modal({title:"名前を変更", input:m.name, ok:"変更"}); if(!v||v===m.name) return;

  }
});
